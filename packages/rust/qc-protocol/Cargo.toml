[package]
name = "qc-protocol"
version = "0.1.0"
publish = false
edition = "2021"
description = "Shared native Quad Cortex USB framing and protobuf protocol"

[dependencies]
flate2 = "1"
prost = "0.14"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
proptest = "1"
