[package]
name = "qc-android"
version = "0.1.0"
publish = false
edition = "2021"
description = "JNI binding for the shared QC native state engine"

[lib]
name = "qc_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
qc-device-runtime = { path = "../qc-device-runtime" }
qc-protocol = { path = "../qc-protocol" }
serde_json = "1"
