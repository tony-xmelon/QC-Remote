[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qc-remote-mcp-server"
version = "0.1.0"
description = "Standalone Model Context Protocol server for Neural DSP Quad Cortex control"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
  "qc-remote-gateway-client==0.1.0",
]

[project.scripts]
qc-remote-mcp = "qc_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_mcp_server"]
