name: Dependency security audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high

  rustsec:
    permissions:
      contents: read
      checks: write
      issues: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - apps/windows/src-tauri
          - packages/rust/qc-android
          - packages/rust/qc-device-runtime
          - packages/rust/qc-protocol
          - packages/rust/qc-relay-client
          - packages/rust/qc-relay-protocol
          - packages/rust/qc-windows-midi
          - services/device-broker
          - services/qc-relay
          - services/qc-remote
          - services/rust-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.directory }}
